<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydroburd Limited Company</title>
    <link rel="icon" type="image/jpg" href="favacon.jpg">
    <link rel="stylesheet" href="style3.css">
    <style>
        .assistant-toggle {
            position: fixed;
            right: 20px;
            bottom: 20px;
            opacity: 0;
            pointer-events: none;
        }

        .assistant-fab {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 12px 25px rgba(13, 110, 253, 0.35);
            transition: all 0.3s ease;
        }

        .assistant-fab:hover {
            transform: translateY(-2px) scale(1.04);
        }

        .assistant-panel {
            position: fixed;
            right: 20px;
            bottom: 100px;
            width: 330px;
            max-width: calc(100vw - 24px);
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
            overflow: hidden;
            border: 1px solid #e9edf3;
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px);
            transition: all 0.25s ease;
            z-index: 1001;
        }

        .assistant-toggle:checked ~ .assistant-panel {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .assistant-toggle:checked + .assistant-fab {
            background: linear-gradient(135deg, #0b5ed7, #0d6efd);
            transform: rotate(90deg);
        }

        .assistant-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
        }

        .assistant-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .assistant-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .assistant-close {
            cursor: pointer;
            font-size: 24px;
            line-height: 1;
            color: #fff;
            font-weight: 500;
        }

        .assistant-body {
            padding: 14px 12px 8px;
            background: #f7f9fc;
        }

        .assistant-message {
            background: #fff;
            border: 1px solid #edf1f7;
            border-radius: 12px;
            padding: 10px 12px;
            color: #1f2937;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .assistant-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 12px 12px;
            background: #f7f9fc;
        }

        .assistant-pill {
            display: inline-block;
            text-decoration: none;
            background: #ffffff;
            border: 1px solid #dfe7f3;
            color: #0d6efd;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .assistant-form {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: #fff;
            border-top: 1px solid #edf1f7;
        }

        .assistant-input {
            flex: 1;
            border: 1px solid #dfe7f3;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
        }

        .assistant-send {
            border: none;
            background: #0d6efd;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
        }

        .assistant-whatsapp {
            display: block;
            margin: 0 12px 12px;
            text-align: center;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            padding: 11px 12px;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .assistant-panel {
                right: 12px;
                bottom: 95px;
                width: min(320px, calc(100vw - 24px));
            }

            .assistant-fab {
                width: 58px;
                height: 58px;
            }
        }
    </style>
</head>
